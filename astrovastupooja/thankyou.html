<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | AstroVastuPooja</title>

    <meta name="description"
        content="Thank you for contacting AstroVastuPooja. Our astrologer will get in touch with you shortly.">

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{

            box-sizing:border-box;

        }

        body{

            margin:0;

            min-height:100vh;

            font-family:Arial, sans-serif;

            background:#fffaf3;

            display:flex;

            flex-direction:column;

        }

        .thankyou-section{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:40px 15px;

            background:
            radial-gradient(
                circle at top left,
                rgba(199,154,43,.12),
                transparent 35%
            ),
            #fffaf3;

        }

        .thankyou-box{

            width:100%;

            max-width:650px;

            background:#fff;

            padding:55px 45px;

            text-align:center;

            border-radius:25px;

            border:1px solid #f0dfc0;

            box-shadow:
                0 25px 70px rgba(0,0,0,.10);

        }

        .success-icon{

            width:90px;

            height:90px;

            margin:0 auto 25px;

            border-radius:50%;

            display:flex;

            align-items:center;

            justify-content:center;

            background:#fff4df;

            color:#8B0000;

            font-size:45px;

            animation:successPulse 2s infinite;

        }

        @keyframes successPulse{

            0%{

                box-shadow:0 0 0 0 rgba(139,0,0,.25);

            }

            70%{

                box-shadow:0 0 0 18px rgba(139,0,0,0);

            }

            100%{

                box-shadow:0 0 0 0 rgba(139,0,0,0);

            }

        }

        .thankyou-box h1{

            font-size:42px;

            font-weight:800;

            color:#222;

            margin-bottom:18px;

        }

        .thankyou-box h1 span{

            color:#8B0000;

        }

        .thankyou-box p{

            color:#666;

            font-size:17px;

            line-height:1.8;

            margin-bottom:30px;

        }

        .thankyou-btn{

            display:inline-flex;

            align-items:center;

            justify-content:center;

            gap:10px;

            padding:15px 30px;

            border-radius:50px;

            background:linear-gradient(
                90deg,
                #8B0000,
                #8B0000
            );

            color:#fff;

            text-decoration:none;

            font-weight:700;

            transition:.35s;

        }

        .thankyou-btn:hover{

            color:#fff;

            transform:translateY(-4px);

            box-shadow:
                0 12px 30px rgba(139,0,0,.25);

        }

        .thankyou-trust{

            margin-top:30px;

            padding-top:25px;

            border-top:1px solid #eee;

            display:flex;

            justify-content:center;

            gap:25px;

            flex-wrap:wrap;

            color:#111;

            font-size:14px;

            font-weight:600;

        }

        .thankyou-trust span{

            display:flex;

            align-items:center;

            gap:7px;

        }

        .thankyou-trust i{

            color:#b8860b;

        }

        @media(max-width:576px){

            .thankyou-box{

                padding:40px 22px;

            }

            .thankyou-box h1{

                font-size:32px;

            }

            .thankyou-box p{

                font-size:16px;

            }

            .thankyou-btn{

                width:100%;

            }

        }

    </style>

})(window,document,'script','dataLayer','GTM-PBP6T986');</script>
<!-- End Google Tag Manager -->

</head>


<body>


<section class="thankyou-section">

    <div class="thankyou-box">

        <div class="success-icon">

            <i class="bi bi-check-lg"></i>

        </div>

        <h1>

            Thank <span>You!</span>

        </h1>

        <p>

            Your consultation request has been received successfully.
            Pt. Dhiraj Baluni will get in touch with you shortly.

        </p>

        <a href="index.html" class="thankyou-btn">

            <i class="bi bi-house-fill"></i>

            Back to Home

        </a>

        <div class="thankyou-trust">

            <span>

                <i class="bi bi-people-fill"></i>

                10,000+ Clients

            </span>

            <span>

                <i class="bi bi-globe"></i>

                100+ Countries

            </span>

            <span>

                <i class="bi bi-shield-check"></i>

                100% Confidential

            </span>

        </div>

    </div>

</section>


</body>

</html>
